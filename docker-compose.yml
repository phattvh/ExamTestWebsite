version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: unless-stopped
    # Speed: tuned for many small writes during exams (commit every ~100ms max)
    command: >
      postgres -c shared_buffers=256MB -c max_connections=200
      -c synchronous_commit=off -c checkpoint_timeout=15min
      -c wal_compression=on -c idle_in_transaction_session_timeout=30s
    env_file:
      - path: .env
        required: false
      - .env.example
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-exam_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-exam_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exam_network

  mongodb:
    image: mongo:6-jammy
    container_name: mongodb
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
      - .env.example
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-mongo}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-mongo}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exam_network

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: unless-stopped
    # Speed: memory-limited LRU cache, no AOF fsync on the hot exam path
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly no
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exam_network

  auth_service:
    build:
      context: ./backend/auth_service
    container_name: auth_service
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
      - .env.example
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Exam sessions must not die mid-test from token expiry; frontend auto-refreshes anyway
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-120}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exam_network

  nginx:
    image: nginx:alpine
    container_name: api_gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exam_network

volumes:
  postgres_data:
  mongodb_data:
  redis_data:

networks:
  exam_network:
    driver: bridge
