# Speed: auto-scale workers to CPU cores
worker_processes auto;

events {
    worker_connections 4096;   # handle burst of concurrent exam clients
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Rate limiting zones
    limit_conn_zone $binary_remote_addr zone=ws_conn_limit:10m;
    limit_req_zone $binary_remote_addr zone=ws_req_limit:10m rate=5r/s;

    upstream auth_service {
        server auth_service:8000;
        keepalive 32;          # reuse backend connections -> lower latency
    }

    upstream question_service {
        server question_service:8000;
        keepalive 32;
    }

    upstream exam_service {
        server exam_service:8000;
        keepalive 32;
    }

    upstream realtime_service {
        server realtime_service:8000;
        keepalive 32;
    }

    upstream grading_service {
        server grading_service:8000;
        keepalive 32;
    }

    upstream proctoring_service {
        server proctoring_service:8000;
        keepalive 32;
    }

    # GZIP compression
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";

    server {
        listen 80;
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # API Gateway - Auth Service routes
        location /api/auth/ {
            rewrite ^/api/auth/(.*) /$1 break;
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/auth/ {
            rewrite ^/api/v1/auth/(.*) /$1 break;
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API Gateway - Question Service routes
        location /api/v1/questions {
            rewrite ^/api/v1/questions$ /api/v1/questions/ break;
            proxy_pass http://question_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/categories {
            rewrite ^/api/v1/categories$ /api/v1/categories/ break;
            proxy_pass http://question_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API Gateway - Exam Service routes
        location /api/v1/exams {
            rewrite ^/api/v1/exams$ /api/v1/exams/ break;
            proxy_pass http://exam_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API Gateway - Grading Service routes
        location /api/v1/grading {
            rewrite ^/api/v1/grading$ /api/v1/grading/ break;
            proxy_pass http://grading_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API Gateway - Grading Service: per-exam/per-attempt results list.
        location /api/v1/results {
            rewrite ^/api/v1/results$ /api/v1/results/ break;
            proxy_pass http://grading_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API Gateway - Proctoring Service routes
        location /api/v1/proctoring {
            rewrite ^/api/v1/proctoring$ /api/v1/proctoring/ break;
            proxy_pass http://proctoring_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Real-time HTTP API
        location /api/v1/realtime/ {
            proxy_pass http://realtime_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Real-time WebSocket
        location /ws {
            proxy_pass http://realtime_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /socket.io {
            proxy_pass http://realtime_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Swagger Docs for Auth Service
        location /docs {
            proxy_pass http://auth_service/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /openapi.json {
            proxy_pass http://auth_service/openapi.json;
            proxy_set_header Host $host;
        }
        
        # Healthcheck endpoint for nginx itself
        location / {
            return 200 'API Gateway is running';
            add_header Content-Type text/plain;
        }
    }
}
