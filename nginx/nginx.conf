# Speed: auto-scale workers to CPU cores
worker_processes auto;

events {
    worker_connections 4096;   # handle burst of concurrent exam clients
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Speed: gzip JSON/JS payloads (exam questions, API responses)
    gzip on;
    gzip_min_length 1024;
    gzip_types application/json text/css application/javascript text/plain;

    upstream auth_service {
        server auth_service:8000;
        keepalive 32;          # reuse backend connections -> lower latency
    }

    server {
        listen 80;
        server_name localhost;

        # API Gateway - Auth Service routes
        location /api/auth/ {
            proxy_pass http://auth_service/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 60s;
        }

        # Real-time WebSocket (exam rooms, proctor alerts) - prepared for realtime service
        location /ws {
            proxy_pass http://auth_service;   # swap to realtime_service when deployed
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Swagger Docs for Auth Service
        location /docs {
            proxy_pass http://auth_service/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /openapi.json {
            proxy_pass http://auth_service/openapi.json;
            proxy_set_header Host $host;
        }

        # Healthcheck endpoint for nginx itself
        location / {
            return 200 'API Gateway is running';
            add_header Content-Type text/plain;
        }
    }
}
