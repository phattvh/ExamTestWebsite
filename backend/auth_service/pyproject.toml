[tool.poetry]
name = "auth-service"
version = "0.1.0"
description = "Auth Service for Exam System"
authors = ["Admin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# libtmux's pytest plugin is incompatible with pytest>=9 (marks on fixtures)
# and is not used by this project; disable it so collection never crashes.
addopts = "-p no:libtmux"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-asyncio = "*"
httpx = "*"
aiosqlite = "*"
